name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Instation2/Instation2.csproj

      - name: Build
        run: dotnet build Instation2/Instation2.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish Instation2/Instation2.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Package
        run: Compress-Archive -Path publish/* -DestinationPath Instation2-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instation2-windows-x64
          path: Instation2-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Instation2-windows-x64.zip
          generate_release_notes: true
